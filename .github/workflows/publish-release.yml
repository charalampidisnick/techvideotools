# Publishes Show Timer installers as the website's download release.
# Claude pushes the installers (split into parts) to a branch named upload/<version>;
# this joins them, publishes release <version>, removes older releases so only the
# latest installers are offered, then deletes the upload branch.
name: Publish installers
on:
  push:
    branches: ['upload/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - name: Join parts
        run: |
          mkdir out
          for base in $(ls parts | sed 's/\.part-.*//' | sort -u); do cat parts/"$base".part-* > "out/$base"; done
          ls -la out
          cd out && sha256sum -c ../SHA256.txt
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG="${GITHUB_REF_NAME#upload/}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" out/* --title "Show Timer $TAG" --notes-file NOTES.md --latest
          for old in $(gh release list --limit 50 --json tagName -q '.[].tagName'); do
            [ "$old" = "$TAG" ] || gh release delete "$old" --yes --cleanup-tag
          done
      - name: Remove upload branch
        if: always()
        run: git push origin --delete "$GITHUB_REF_NAME"
